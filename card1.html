<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Cards</title>


   <style>
      *{
         margin: 0;
         padding: 0;
         box-sizing: border-box;
      }
      .container{
         width: 100%;
         height: 100%;
         min-height: 800px;  
    background: linear-gradient(
        to right,
        #6860B0 0%,
        #948DE6 60%,
        #B8B4FF 100%
    );
         display: flex;
         justify-content: center;
         align-items: center;
      }


      .card{
         width: 340px;
         height: 510px;
         background-color: white;
         border-radius: 20px;


         display: flex;
         flex-direction: column;
         align-items: center;
         gap: 30px;
         padding: 20px;
      }


      .card img{
         height: 46%;
         border-radius: 10px;
      }


      .card h2{
         font-weight: bold;
         font-size: 1.5rem;
      }


      .card p{
         font-size: 1.2em;
      }
   </style>
</head>
<body>
   


   <div class="container">


      <div class="card">
         <img src="qrcode.png"/>
         <h2>
            Improve your frontend skills by developing Projects
         </h2>


         <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Nisi animi
            voluptate dolor autem quisquam quos at quasi eos.Lorem ipsum dolor, sit
            amet consectetur adipisicing elit. Consectetur </p>
      </div>
   </div>
</body>
</html>
